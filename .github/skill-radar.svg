<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
<style>
  .grid { fill: none; stroke: #00f5ff; stroke-opacity: 0.2; }
  .axis { stroke: #7c00ff; stroke-width: 2; }
  .area { fill: rgba(255,0,128,0.35); stroke: #ff0080; stroke-width: 2; }
  .sweep {
    fill: none;
    stroke: #00f5ff;
    stroke-width: 2;
    stroke-dasharray: 5 10;
    animation: rotate 4s linear infinite;
    transform-origin: 250px 250px;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

<circle cx="250" cy="250" r="200" class="grid"/>
<circle cx="250" cy="250" r="150" class="grid"/>
<circle cx="250" cy="250" r="100" class="grid"/>
<circle cx="250" cy="250" r="50" class="grid"/>

<line x1="250" y1="50" x2="250" y2="450" class="axis"/>
<line x1="50" y1="250" x2="450" y2="250" class="axis"/>
<line x1="100" y1="100" x2="400" y2="400" class="axis"/>
<line x1="400" y1="100" x2="100" y2="400" class="axis"/>

<polygon points="250,80 360,170 330,310 250,360 170,310 140,170" class="area"/>

<circle cx="250" cy="250" r="200" class="sweep"/>
</svg>
