<svg width="500" height="500" viewBox="0 0 500 500"
     xmlns="http://www.w3.org/2000/svg">

<style>
  .grid { fill: none; stroke: #00f5ff; stroke-opacity: 0.25; }
  .axis { stroke: #7c00ff; stroke-width: 2; }
  .area {
    fill: rgba(255,0,128,0.35);
    stroke: #ff0080;
    stroke-width: 2;
    filter: url(#glow);
  }
  .label {
    fill: #00f5ff;
    font-size: 14px;
    font-family: monospace;
  }
  .sweep {
    fill: none;
    stroke: #00f5ff;
    stroke-width: 2;
    stroke-dasharray: 6 12;
    animation: rotate 4s linear infinite;
    transform-origin: 250px 250px;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

<defs>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Grid -->
<circle cx="250" cy="250" r="200" class="grid"/>
<circle cx="250" cy="250" r="150" class="grid"/>
<circle cx="250" cy="250" r="100" class="grid"/>
<circle cx="250" cy="250" r="50"  class="grid"/>

<!-- Axes -->
<line x1="250" y1="50"  x2="250" y2="450" class="axis"/>
<line x1="50"  y1="250" x2="450" y2="250" class="axis"/>
<line x1="100" y1="100" x2="400" y2="400" class="axis"/>
<line x1="400" y1="100" x2="100" y2="400" class="axis"/>

<!-- Radar Area (values tuned visually) -->
<polygon
  points="
    250,90
    360,170
    330,315
    250,360
    170,315
    140,170
  "
  class="area"/>

<!-- Data Points -->
<g fill="#ffffff">
  <circle cx="250" cy="90"  r="4"/>
  <circle cx="360" cy="170" r="4"/>
  <circle cx="330" cy="315" r="4"/>
  <circle cx="250" cy="360" r="4"/>
  <circle cx="170" cy="315" r="4"/>
  <circle cx="140" cy="170" r="4"/>
</g>

<!-- Labels -->
<g class="label" text-anchor="middle">
  <text x="250" y="35">Web Exploitation</text>
  <text x="420" y="135">Red Team Ops</text>
  <text x="420" y="375">Automation</text>
  <text x="250" y="485">Cloud Security</text>
  <text x="80"  y="375">Threat Intel</text>
  <text x="80"  y="135">Network Attacks</text>
</g>

<!-- Sweep -->
<circle cx="250" cy="250" r="200" class="sweep"/>

</svg>
